# =============================================================================
# New-API 本地编译部署配置 (Local Build & Deploy)
# 容器名称: new-api
# 
# 使用方式:
#   1. docker-compose -f docker-compose.build.yml up -d --build
#   2. 访问 http://localhost:3000
#
# 与其他 docker-compose 的区别:
#   - 使用 build: 从本地源码编译（而非拉取远程镜像）
#   - 适合本地开发、测试、自定义修改后部署
# =============================================================================

services:
  new-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGETOS: linux
        TARGETARCH: amd64
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3003:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=postgresql://root:123456@postgres:5432/new-api
      - REDIS_CONN_STRING=redis://:123456@redis:6379
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - NODE_NAME=new-api-node-1
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_started
    networks:
      - new-api-network
    dns:
      - 8.8.8.8
      - 114.114.114.114
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: new-api-redis
    restart: always
    command: ["redis-server", "--requirepass", "123456"]
    volumes:
      - redis_data:/data
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "123456", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:15-alpine
    container_name: new-api-postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: new-api
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d new-api"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local

networks:
  new-api-network:
    driver: bridge
